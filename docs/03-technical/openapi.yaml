openapi: 3.1.0
info:
  title: BU2 Agent Payment API
  version: 0.3.0
  description: Transaction-first API with environment-bound machine access, tenant-scoped agent operations, controlled operator surfaces, Receipt v0.2/v0.3 verification, reliable Webhooks, and explicit x402 settlement recovery.
  x-bu2-contract-status: phase0-frozen
servers:
  - url: https://api.bu2.com/v1
security:
  - bearerAuth: []
paths:
  /environment:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      security: []
      operationId: getEnvironment
      summary: Read the server-authored environment and execution contract before mutations
      responses:
        '200':
          description: Versioned environment information and current Receipt issuer
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /budgets:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      security: []
      operationId: listBudgets
      summary: List configured budget scopes and current availability
      responses:
        '200':
          description: Budget scopes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Budget' }
    post:
      operationId: createBudget
      summary: Create an active budget scope
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBudget' }
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /budgets/{budget_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: budget_id
        in: path
        required: true
        schema: { type: string, pattern: '^bud_[A-Za-z0-9_-]+$' }
    get:
      security: []
      operationId: getBudget
      summary: Read one budget scope
      responses:
        '200':
          description: Budget scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '404': { $ref: '#/components/responses/NotFound' }
  /budget_holds:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      security: []
      operationId: listBudgetHolds
      summary: List budget holds
      responses:
        '200':
          description: Budget holds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BudgetHold' }
  /budget_holds/{budget_hold_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: budget_hold_id
        in: path
        required: true
        schema: { type: string, pattern: '^hold_[A-Za-z0-9_-]+$' }
    get:
      security: []
      operationId: getBudgetHold
      summary: Read one budget hold
      responses:
        '200':
          description: Budget hold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetHold' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payment_mandates:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      security: []
      operationId: listPaymentMandates
      summary: List versioned payment mandates
      responses:
        '200':
          description: Payment mandates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentMandate' }
    post:
      operationId: createPaymentMandate
      summary: Create a draft payment mandate version
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentMandate' }
      responses:
        '201':
          description: Draft payment mandate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMandate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payment_mandates/{mandate_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: mandate_id
        in: path
        required: true
        schema: { type: string, pattern: '^mdt_[A-Za-z0-9_-]+$' }
    get:
      operationId: getPaymentMandate
      summary: Read one payment mandate
      responses:
        '200':
          description: Payment mandate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMandate' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payment_mandates/{mandate_id}/{action}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: mandate_id
        in: path
        required: true
        schema: { type: string, pattern: '^mdt_[A-Za-z0-9_-]+$' }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [activate, suspend, revoke, expire] }
    post:
      operationId: transitionPaymentMandate
      summary: Change payment mandate state
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MandateTransition' }
      responses:
        '200':
          description: Updated payment mandate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMandate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /financial_postings:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      security: []
      operationId: listFinancialPostings
      summary: List immutable financial postings
      responses:
        '200':
          description: Financial postings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FinancialPosting' }
  /quotes:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: createQuote
      summary: Create a seller quote
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuote' }
      responses:
        '201':
          description: Quote created
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /receivables:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: listReceivables
      summary: List account-owned receivables
      responses:
        '200':
          description: Receivables visible to the current account or Agent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Receivable' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createReceivable
      summary: Create an account-owned receivable from an active quote
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReceivable' }
      responses:
        '201':
          description: Receivable created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receivable' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /receivables/{receivable_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: getReceivable
      summary: Read one account-owned receivable
      parameters:
        - $ref: '#/components/parameters/ReceivableId'
      responses:
        '200':
          description: Current receivable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receivable' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /receivables/{receivable_id}/collections:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - $ref: '#/components/parameters/ReceivableId'
    post:
      operationId: verifyInboundPayment
      summary: Verify an inbound payment and post a receivable once
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyInboundPayment' }
      responses:
        '201':
          description: Inbound payment verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyInboundPaymentResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /collections:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: listCollections
      summary: List verified inbound collections
      responses:
        '200':
          description: Collections visible to the current account or Agent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Collection' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /collections/{collection_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - $ref: '#/components/parameters/CollectionId'
    get:
      operationId: getCollection
      summary: Read one inbound collection
      responses:
        '200':
          description: Current inbound collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collections/{collection_id}/access_grants:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - $ref: '#/components/parameters/CollectionId'
    post:
      operationId: createAccessGrant
      summary: Grant recoverable paid access from a posted Collection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccessGrant' }
      responses:
        '201':
          description: Access grant created or replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessGrant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /access_grants:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: listAccessGrants
      summary: List recoverable paid access grants
      responses:
        '200':
          description: Access grants visible to the current account or Agent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AccessGrant' }
  /access_grants/{access_grant_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - $ref: '#/components/parameters/AccessGrantId'
    get:
      operationId: getAccessGrant
      summary: Read one recoverable paid access grant
      responses:
        '200':
          description: Access grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessGrant' }
        '404': { $ref: '#/components/responses/NotFound' }
  /access_grants/{access_grant_id}/recover:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - $ref: '#/components/parameters/AccessGrantId'
    post:
      operationId: recoverAccessGrant
      summary: Re-read and reactivate a paid access grant from its posted Collection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoverAccessGrant' }
      responses:
        '200':
          description: Recovered access grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessGrant' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payment_intents:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: createPaymentIntent
      summary: Create a buyer payment intent and evaluate its mandate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentIntent' }
      responses:
        '201':
          description: Intent created
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /payment_intents/{payment_intent_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: getPaymentIntent
      summary: Read payment and authorization state
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
      responses:
        '200':
          description: Current intent
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payment_intents/{payment_intent_id}/authorization:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: decideAuthorization
      summary: Record a human authorization decision
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [authorize, decline] }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Decision recorded
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /payment_intents/{payment_intent_id}/execution:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: executePaymentIntent
      summary: Execute an already approved payment intent without operator approval
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Executed or previously reserved payment intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /transactions:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: listTransactions
      summary: List transactions with payment, delivery, channel, and receipt context
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Transactions ordered newest first
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /transactions/{transaction_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: getTransaction
      summary: Read one transaction and its related payment evidence
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction detail
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /transactions/{transaction_id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: submitDelivery
      summary: Submit machine-readable delivery evidence
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryEvidence' }
      responses:
        '201':
          description: Delivery recorded
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [transaction, delivery]
                properties:
                  transaction: { $ref: '#/components/schemas/Transaction' }
                  delivery: { $ref: '#/components/schemas/DeliveryRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /transactions/{transaction_id}/settlements:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: settleTransaction
      summary: Settle a delivered transaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Settled and receipt issued
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                required: [transaction, receipt]
                properties:
                  transaction: { $ref: '#/components/schemas/Transaction' }
                  receipt: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /transactions/{transaction_id}/settlement_recoveries:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: recoverTransactionSettlement
      summary: Query an unknown provider settlement without submitting another payment
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Recovery query recorded; the result remains unknown or settlement and Receipt are finalized
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementRecoveryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /transactions/{transaction_id}/cancellations:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: cancelTransaction
      summary: Cancel a reserved transaction and release its funds
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cancellation' }
      responses:
        '200':
          description: Canceled transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /transactions/{transaction_id}/refunds:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: requestTransactionRefund
      summary: Request a bounded full or partial refund
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequest' }
      responses:
        '200':
          description: Refund fact or provider-unknown recovery requirement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /refunds:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: listRefunds
      summary: List visible refund facts
      responses:
        '200':
          description: Refund facts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Refund' }
  /refunds/{refund_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: refund_id
        in: path
        required: true
        schema: { type: string, pattern: '^ref_[A-Za-z0-9_-]+$' }
    get:
      operationId: getRefund
      summary: Read a refund fact
      responses:
        '200':
          description: Refund fact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '404': { $ref: '#/components/responses/NotFound' }
  /refunds/{refund_id}/recoveries:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - name: refund_id
        in: path
        required: true
        schema: { type: string, pattern: '^ref_[A-Za-z0-9_-]+$' }
    post:
      operationId: recoverRefund
      summary: Recover a provider-unknown refund without submitting a new refund
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Refund recovery result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  /receipts/{receipt_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: getReceipt
      summary: Read a verifiable receipt
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      responses:
        '200':
          description: Receipt
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /receipts/{receipt_id}/verify:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      security: []
      operationId: verifyReceipt
      summary: Verify a receipt signature and transaction binding
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      responses:
        '200':
          description: Receipt verification result
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [receipt_id, valid, signature_valid, issuer_trusted, settlement_confirmed, environment_valid, environment_interpretation, schema_version, canonicalization_version]
                properties:
                  receipt_id: { type: string, pattern: '^rcpt_[A-Za-z0-9_-]+$' }
                  valid: { type: boolean }
                  signature_valid: { type: boolean }
                  issuer_trusted: { type: boolean }
                  settlement_confirmed: { type: boolean }
                  environment_valid: { type: boolean }
                  environment_interpretation: { $ref: '#/components/schemas/ReceiptEnvironmentInterpretation' }
                  schema_version: { type: string, enum: ['0.1', '0.2', '0.3'] }
                  canonicalization_version: { type: string, enum: [BU2-LEGACY-0.1, RFC8785-JCS-1] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhook_subscriptions:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: createWebhookSubscription
      summary: Create an idempotent Webhook subscription
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWebhookSubscription' }
      responses:
        '201':
          description: Subscription metadata created; secret material is never returned
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /webhook_subscriptions/{subscription_id}/secret_rotations:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: rotateWebhookSecret
      summary: Add a new signing-secret version with a bounded overlap window
      parameters:
        - $ref: '#/components/parameters/WebhookSubscriptionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateWebhookSecret' }
      responses:
        '201':
          description: Rotation metadata created; secret material is never returned
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSecretRotation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /webhook_dead_letters:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: listWebhookDeadLetters
      summary: List terminal Webhook delivery failures
      responses:
        '200':
          description: Dead-lettered Outbox records
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookOutboxList' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /webhook_outbox/{outbox_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: listWebhookDeliveryAttempts
      summary: List immutable delivery-attempt audit records
      parameters:
        - $ref: '#/components/parameters/WebhookOutboxId'
      responses:
        '200':
          description: Delivery attempts ordered by occurrence
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryAttemptList' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /webhook_outbox/{outbox_id}/replays:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: replayWebhook
      summary: Requeue one dead-lettered event without creating a new business event
      parameters:
        - $ref: '#/components/parameters/WebhookOutboxId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayWebhook' }
      responses:
        '201':
          description: Replay audit record created and original event requeued
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookReplay' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /access:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: getAccessIdentity
      summary: Read the authenticated principal and its bounded permissions
      responses:
        '200':
          description: Current access identity without credential material
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /operations/support_bundles:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: createSupportBundle
      summary: Create a redacted operator diagnostic bundle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSupportBundle' }
      responses:
        '201':
          description: Redacted support bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportBundle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operations/tenants/{tenant_id}/resets:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: resetTenantAccess
      summary: Invalidate one Sandbox tenant credential generation without deleting financial facts
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantAccessResetRequest' }
      responses:
        '201':
          description: Tenant access reset audit result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantAccessReset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: Optional caller-supplied trace identifier; BU2 generates one when omitted.
      schema: { type: string, pattern: '^trc_[A-Za-z0-9_-]{8,251}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 255 }
    PaymentIntentId:
      name: payment_intent_id
      in: path
      required: true
      schema: { type: string, pattern: '^pi_[A-Za-z0-9_-]+$', maxLength: 255 }
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema: { type: string, pattern: '^txn_[A-Za-z0-9_-]+$', maxLength: 255 }
    ReceiptId:
      name: receipt_id
      in: path
      required: true
      schema: { type: string, pattern: '^rcpt_[A-Za-z0-9_-]+$', maxLength: 255 }
    ReceivableId:
      name: receivable_id
      in: path
      required: true
      schema: { type: string, pattern: '^rcv_[A-Za-z0-9_-]+$', maxLength: 255 }
    CollectionId:
      name: collection_id
      in: path
      required: true
      schema: { type: string, pattern: '^cpay_[A-Za-z0-9_-]+$', maxLength: 255 }
    AccessGrantId:
      name: access_grant_id
      in: path
      required: true
      schema: { type: string, pattern: '^agr_[A-Za-z0-9_-]+$', maxLength: 255 }
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, pattern: '^ten_[A-Za-z0-9_-]+$', maxLength: 255 }
    WebhookSubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema: { type: string, pattern: '^whsub_[A-Za-z0-9_-]+$', maxLength: 255 }
    WebhookOutboxId:
      name: outbox_id
      in: path
      required: true
      schema: { type: string, pattern: '^out_[A-Za-z0-9_-]+$', maxLength: 255 }
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the preceding page.
      schema: { type: string, minLength: 1, maxLength: 1024 }
  headers:
    RequestId:
      description: Server-generated identifier for this HTTP request.
      schema: { type: string, pattern: '^req_[A-Za-z0-9_-]+$' }
    TraceId:
      description: End-to-end trace identifier accepted from the caller or generated by BU2.
      schema: { type: string, pattern: '^trc_[A-Za-z0-9_-]{8,251}$' }
  schemas:
    CreatePaymentMandate:
      type: object
      additionalProperties: false
      required: [account_id, agent_id, funding_source_id, receiving_target_id, environment, currency, max_single_amount, daily_limit, monthly_limit, effective_at]
      properties:
        id: { type: string, pattern: '^mdt_[A-Za-z0-9_-]+$' }
        account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$' }
        agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$' }
        funding_source_id: { type: string, pattern: '^fund_[A-Za-z0-9_-]+$' }
        receiving_target_id: { type: string, pattern: '^tgt_[A-Za-z0-9_-]+$' }
        environment: { type: string, enum: [local, sandbox, live] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        max_single_amount: { type: integer, minimum: 0 }
        daily_limit: { type: integer, minimum: 0 }
        monthly_limit: { type: integer, minimum: 0 }
        merchant_allowlist: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 255 } }
        merchant_denylist: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 255 } }
        category_allowlist: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 120 } }
        purpose_constraints: { type: object, additionalProperties: false, properties: { required_terms: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 120 } } } }
        resource_constraints: { type: object, additionalProperties: true, maxProperties: 20 }
        effective_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        created_by: { type: [string, 'null'], maxLength: 255 }
        supersedes_mandate_id: { type: string, pattern: '^mdt_[A-Za-z0-9_-]+$' }
    MandateTransition:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500 }
    PaymentMandate:
      allOf:
        - $ref: '#/components/schemas/CreatePaymentMandate'
        - type: object
          required: [id, version, status, created_at, updated_at]
          properties:
            id: { type: string, pattern: '^mdt_[A-Za-z0-9_-]+$' }
            version: { type: integer, minimum: 1 }
            status: { type: string, enum: [draft, active, suspended, revoked, expired] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CreateBudget:
      type: object
      additionalProperties: false
      required: [scope_type, scope_id, currency, period, limit_minor]
      properties:
        id: { type: string, pattern: '^bud_[A-Za-z0-9_-]+$' }
        scope_type: { type: string, enum: [workspace, project, account, agent] }
        scope_id: { type: string, minLength: 1, maxLength: 255 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        period: { type: string, enum: [lifetime, calendar_month, rolling_24h] }
        limit_minor: { type: integer, minimum: 0 }
    Budget:
      allOf:
        - $ref: '#/components/schemas/CreateBudget'
        - type: object
          required: [id, status, version, created_at, updated_at, active_hold_total, consumed_total, available_minor, hold_count]
          properties:
            id: { type: string, pattern: '^bud_[A-Za-z0-9_-]+$' }
            status: { type: string, enum: [active, paused, exhausted, expired] }
            version: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            active_hold_total: { type: integer, minimum: 0 }
            consumed_total: { type: integer, minimum: 0 }
            available_minor: { type: integer, minimum: 0 }
            hold_count: { type: integer, minimum: 0 }
    BudgetHold:
      type: object
      additionalProperties: false
      required: [id, transaction_id, payment_intent_id, budget_id, amount_value, currency, status, authorization_id, idempotency_key, created_at]
      properties:
        id: { type: string, pattern: '^hold_[A-Za-z0-9_-]+$' }
        transaction_id: { type: string, pattern: '^txn_[A-Za-z0-9_-]+$' }
        payment_intent_id: { type: string, pattern: '^pi_[A-Za-z0-9_-]+$' }
        budget_id: { type: string, pattern: '^bud_[A-Za-z0-9_-]+$' }
        amount_value: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [active, consumed, released, expired] }
        authorization_id: { type: string, pattern: '^auth_[A-Za-z0-9_-]+$' }
        idempotency_key: { type: string, minLength: 8, maxLength: 255 }
        created_at: { type: string, format: date-time }
        released_at: { type: [string, 'null'], format: date-time }
        consumed_at: { type: [string, 'null'], format: date-time }
    FinancialPosting:
      type: object
      additionalProperties: false
      required: [id, event_id, event_type, source_id, direction, account, amount_value, currency, created_at]
      properties:
        id: { type: string, pattern: '^pst_[A-Za-z0-9_-]+$' }
        event_id: { type: string, pattern: '^evt_[A-Za-z0-9_-]+$' }
        event_type: { type: string }
        transaction_id: { type: [string, 'null'], pattern: '^txn_[A-Za-z0-9_-]+$' }
        budget_id: { type: [string, 'null'], pattern: '^bud_[A-Za-z0-9_-]+$' }
        source_id: { type: string, pattern: '^(hold|cpay)_[A-Za-z0-9_-]+$' }
        direction: { type: string, enum: [debit, credit] }
        account: { type: string, minLength: 1, maxLength: 120 }
        amount_value: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        created_at: { type: string, format: date-time }
    EnvironmentInfo:
      type: object
      additionalProperties: false
      required: [service, environment, environment_contract_version, chain_id, network, execution_backend, api_contract_version, mcp_contract_versions, receipt_schema_versions, execution_status, access_contract_version, access_mode, public_capabilities, receipt_issuer]
      properties:
        service: { type: string, const: bu2-reference-server }
        environment: { type: string, enum: [local, sandbox, live] }
        environment_contract_version: { type: string, const: '1.0' }
        chain_id: { type: [integer, 'null'], enum: [null, 84532, 8453] }
        network: { type: [string, 'null'], enum: [null, 'eip155:84532', 'eip155:8453'] }
        execution_backend: { type: string, enum: [simulated, x402] }
        api_contract_version: { type: string, const: 0.3.0 }
        mcp_contract_versions:
          type: array
          minItems: 1
          items: { type: string, enum: [0.3.0] }
        receipt_schema_versions:
          type: array
          minItems: 2
          items: { type: string, enum: ['0.2', '0.3'] }
        execution_status: { type: string, enum: [execution_disabled, execution_enabled] }
        access_contract_version: { type: string, const: '1.0' }
        access_mode: { type: string, enum: [development_open, authenticated] }
        public_capabilities:
          type: array
          items: { type: string }
        receipt_issuer: { $ref: '#/components/schemas/ReceiptIssuer' }
    AccessIdentity:
      type: object
      additionalProperties: false
      required: [mode, authenticated, environment, principal_id, tenant_id, role, permissions, account_ids, agent_ids, credential_generation]
      properties:
        mode: { type: string, enum: [development_open, authenticated] }
        authenticated: { type: boolean }
        environment: { type: string, enum: [local, sandbox, live] }
        principal_id: { type: [string, 'null'] }
        tenant_id: { type: [string, 'null'] }
        role: { type: [string, 'null'], enum: [agent, developer, operator, null] }
        permissions: { type: array, items: { type: string } }
        account_ids: { type: array, items: { type: string } }
        agent_ids: { type: array, items: { type: string } }
        credential_generation: { type: [integer, 'null'] }
        identity:
          oneOf:
            - { $ref: '#/components/schemas/IdentitySummary' }
            - { type: 'null' }
          description: Persisted Principal, Account and Agent ownership visible to the authenticated caller.
        wallet_bindings:
          $ref: '#/components/schemas/WalletBindings'
    IdentityPrincipal:
      type: object
      additionalProperties: false
      required: [environment, id, tenant_id, kind, display_name, status, generation, created_at, updated_at]
      properties:
        environment: { type: string, enum: [local, sandbox, live] }
        id: { type: string, pattern: '^(usr|agt)_[A-Za-z0-9_-]+$' }
        tenant_id: { type: string, pattern: '^ten_[A-Za-z0-9_-]+$' }
        kind: { type: string, enum: [human, service] }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [active, disabled] }
        generation: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IdentityAccount:
      type: object
      additionalProperties: false
      required: [environment, id, tenant_id, owner_principal_id, display_name, status, generation, created_at, updated_at]
      properties:
        environment: { type: string, enum: [local, sandbox, live] }
        id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$' }
        tenant_id: { type: string, pattern: '^ten_[A-Za-z0-9_-]+$' }
        owner_principal_id: { type: string, pattern: '^(usr|agt)_[A-Za-z0-9_-]+$' }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [active, disabled] }
        generation: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IdentityAgent:
      type: object
      additionalProperties: false
      required: [environment, id, tenant_id, owner_principal_id, display_name, status, generation, created_at, updated_at]
      properties:
        environment: { type: string, enum: [local, sandbox, live] }
        id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$' }
        tenant_id: { type: string, pattern: '^ten_[A-Za-z0-9_-]+$' }
        owner_principal_id: { type: string, pattern: '^(usr|agt)_[A-Za-z0-9_-]+$' }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [active, disabled] }
        generation: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IdentitySummary:
      type: object
      additionalProperties: false
      required: [environment, tenant_id, principal, accounts, agents]
      properties:
        environment: { type: string, enum: [local, sandbox, live] }
        tenant_id: { type: string, pattern: '^ten_[A-Za-z0-9_-]+$' }
        principal: { $ref: '#/components/schemas/IdentityPrincipal' }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/IdentityAccount' }
        agents:
          type: array
          items: { $ref: '#/components/schemas/IdentityAgent' }
        funding_sources:
          type: array
          items: { $ref: '#/components/schemas/FundingSourceBinding' }
        receiving_targets:
          type: array
          items: { $ref: '#/components/schemas/ReceivingTargetBinding' }
    FundingSourceBinding:
      type: object
      additionalProperties: false
      required: [environment, id, tenant_id, account_id, agent_id, asset, network, provider, source_reference, status, verification_status, generation, created_at, updated_at]
      properties:
        environment: { type: string, enum: [local, sandbox, live] }
        id: { type: string, pattern: '^fund_[A-Za-z0-9_-]+$' }
        tenant_id: { type: string, pattern: '^ten_[A-Za-z0-9_-]+$' }
        account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$' }
        agent_id: { type: [string, 'null'], pattern: '^agt_[A-Za-z0-9_-]+$' }
        asset: { type: string, minLength: 1, maxLength: 120 }
        network: { type: [string, 'null'], maxLength: 120 }
        provider: { type: string, minLength: 1, maxLength: 120 }
        source_reference: { type: string, minLength: 1, maxLength: 512 }
        status: { type: string, enum: [active, disabled, revoked] }
        verification_status: { type: string, enum: [pending, verified, failed, revoked] }
