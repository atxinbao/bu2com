      required: [id, quote_id, payer_account_id, payee_account_id, buyer_agent_id, seller_agent_id, payment_mandate_id, amount, purpose, status, transaction_id, authorization, created_at]
      properties:
        id: { type: string, pattern: '^pi_[A-Za-z0-9_-]+$' }
        quote_id: { type: string, pattern: '^quo_[A-Za-z0-9_-]+$', maxLength: 255 }
        payer_account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$', maxLength: 255 }
        payee_account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$', maxLength: 255 }
        buyer_agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$', maxLength: 255 }
        seller_agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$', maxLength: 255 }
        payment_mandate_id: { type: string, pattern: '^mdt_[A-Za-z0-9_-]+$', maxLength: 255 }
        amount: { $ref: '#/components/schemas/Amount' }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        execution_mode: { type: string, enum: [immediate, deferred] }
        external_context: { $ref: '#/components/schemas/ExternalContext' }
        metadata:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }
        status: { type: string, enum: [requires_authorization, authorized, funds_reserved, delivery_submitted, settled, declined, expired, canceled, refunded, disputed] }
        transaction_id: { type: [string, 'null'], pattern: '^txn_[A-Za-z0-9_-]+$' }
        authorization: { $ref: '#/components/schemas/Authorization' }
        policy_decision: { $ref: '#/components/schemas/PolicyDecision' }
        funding_source_binding_id: { type: [string, 'null'], pattern: '^fund_[A-Za-z0-9_-]+$' }
        receiving_target_binding_id: { type: [string, 'null'], pattern: '^tgt_[A-Za-z0-9_-]+$' }
        budget_id: { type: [string, 'null'], pattern: '^bud_[A-Za-z0-9_-]+$' }
        created_at: { type: string, format: date-time }
    DeliveryEvidence:
      type: object
      additionalProperties: false
      required: [type, evidence_hash]
      properties:
        type: { type: string, minLength: 1, maxLength: 100 }
        evidence_hash: { type: string, pattern: '^sha256:[A-Za-z0-9]+$', maxLength: 256 }
        summary: { type: string, maxLength: 1000 }
    DeliveryRecord:
      type: object
      additionalProperties: false
      required: [id, transaction_id, type, evidence_hash, submitted_at]
      properties:
        id: { type: string, pattern: '^dlv_[A-Za-z0-9_-]+$' }
        transaction_id: { type: string, pattern: '^txn_[A-Za-z0-9_-]+$' }
        type: { type: string, minLength: 1, maxLength: 100 }
        evidence_hash: { type: string, pattern: '^sha256:[A-Za-z0-9]+$', maxLength: 256 }
        summary: { type: string, maxLength: 1000 }
        submitted_at: { type: string, format: date-time }
    Transaction:
      type: object
      required: [id, payment_intent_id, status, authorized_amount, reserved_amount, settled_amount, refunded_amount]
      properties:
        id: { type: string, pattern: '^txn_[A-Za-z0-9_-]+$' }
        payment_intent_id: { type: string, pattern: '^pi_[A-Za-z0-9_-]+$' }
        status: { type: string, enum: [authorized, funds_reserved, delivery_submitted, settled, canceled, refunded, disputed] }
        authorized_amount: { $ref: '#/components/schemas/Amount' }
        reserved_amount: { $ref: '#/components/schemas/Amount' }
        settled_amount: { $ref: '#/components/schemas/Amount' }
        refunded_amount: { $ref: '#/components/schemas/Amount' }
    TransactionView:
      type: object
      required: [transaction, payment_intent, quote, delivery, receipt, refunds, cancellation, payment_channel, settlement_control]
      properties:
        transaction: { $ref: '#/components/schemas/Transaction' }
        payment_intent:
          anyOf:
            - { $ref: '#/components/schemas/PaymentIntent' }
            - { type: 'null' }
        quote:
          anyOf:
            - { $ref: '#/components/schemas/Quote' }
            - { type: 'null' }
        delivery:
          anyOf:
            - { $ref: '#/components/schemas/DeliveryRecord' }
            - { type: 'null' }
        receipt:
          anyOf:
            - { $ref: '#/components/schemas/Receipt' }
            - { type: 'null' }
        refunds:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        cancellation:
          anyOf:
            - { $ref: '#/components/schemas/Cancellation' }
            - { type: 'null' }
        payment_channel: { type: string }
        settlement_control:
          anyOf:
            - { $ref: '#/components/schemas/SettlementControl' }
            - { type: 'null' }
    Cancellation:
      type: object
      additionalProperties: false
      properties:
        reason: { type: [string, 'null'], maxLength: 500 }
        status: { type: string, enum: [canceled] }
        provider_reference: { type: [string, 'null'] }
        canceled_at: { type: [string, 'null'], format: date-time }
    CancellationResult:
      type: object
      required: [transaction, cancellation]
      properties:
        transaction: { $ref: '#/components/schemas/Transaction' }
        cancellation: { $ref: '#/components/schemas/Cancellation' }
    RefundRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/Amount' }
        reason: { type: [string, 'null'], maxLength: 500 }
    Refund:
      type: object
      additionalProperties: false
      required: [id, transaction_id, payment_intent_id, amount, status, reason, provider_reference, created_at, refunded_at, recovery_required]
      properties:
        id: { type: string, pattern: '^ref_[A-Za-z0-9_-]+$' }
        transaction_id: { type: string, pattern: '^txn_[A-Za-z0-9_-]+$' }
        payment_intent_id: { type: string, pattern: '^pi_[A-Za-z0-9_-]+$' }
        amount: { $ref: '#/components/schemas/Amount' }
        status: { type: string, enum: [processing, refunded, provider_unknown] }
        reason: { type: [string, 'null'] }
        provider_reference: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        refunded_at: { type: [string, 'null'], format: date-time }
        recovery_required: { type: boolean }
        failure_reason: { type: [string, 'null'] }
    RefundResult:
      type: object
      required: [transaction, refund]
      properties:
        transaction: { $ref: '#/components/schemas/Transaction' }
        refund: { $ref: '#/components/schemas/Refund' }
        recovery:
          type: object
          additionalProperties: false
          properties:
            status: { type: string, enum: [refunded, provider_unknown] }
            reason_code: { type: [string, 'null'] }
    SettlementControl:
      type: object
      additionalProperties: false
      required: [status, provider_reference, reason_code, updated_at, resolved_at, recovery_attempts]
      properties:
        status: { type: string, enum: [settled, provider_unknown] }
        provider_reference: { type: string }
        reason_code: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        recovery_attempts: { type: integer, minimum: 0 }
    SettlementRecovery:
      type: object
      additionalProperties: false
      required: [status, reason_code, attempt_id]
      properties:
        status: { type: string, enum: [provider_unknown, settled] }
        reason_code: { type: [string, 'null'] }
        attempt_id: { type: string, pattern: '^arv_[A-Za-z0-9_-]+$' }
    SettlementRecoveryResult:
      type: object
      additionalProperties: false
      required: [transaction, receipt, recovery]
      properties:
        transaction: { $ref: '#/components/schemas/Transaction' }
        receipt:
          anyOf:
            - { $ref: '#/components/schemas/Receipt' }
            - { type: 'null' }
        recovery: { $ref: '#/components/schemas/SettlementRecovery' }
    PageMetadata:
      type: object
      additionalProperties: false
      required: [limit, has_more, next_cursor]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }
    TransactionPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TransactionView' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    Receipt:
      type: object
      additionalProperties: false
      required: [id, version, schema_version, canonicalization_version, transaction_id, settlement_id, quote_id, payment_intent_id, payer_account_id, payee_account_id, buyer_agent_id, seller_agent_id, amount, authorization_id, payment_mandate_id, delivery_id, delivery_evidence_hash, environment, payment_channel, provider_reference, signed_at, issued_at, signature_algorithm, verification_key_id, signature, public_key]
      allOf:
        - if:
            properties:
              schema_version: { const: '0.3' }
            required: [schema_version]
          then:
            required: [environment_contract_version, execution_backend, chain_id, network, receipt_issuer_id]
      properties:
        id: { type: string, pattern: '^rcpt_[A-Za-z0-9_-]+$' }
        version: { type: string, enum: ['0.2', '0.3'] }
        schema_version: { type: string, enum: ['0.2', '0.3'] }
        canonicalization_version: { type: string, enum: [RFC8785-JCS-1] }
        transaction_id: { type: string, pattern: '^txn_[A-Za-z0-9_-]+$' }
        settlement_id: { type: string, pattern: '^stl_[A-Za-z0-9_-]+$' }
        quote_id: { type: string, pattern: '^quo_[A-Za-z0-9_-]+$' }
        payment_intent_id: { type: string, pattern: '^pi_[A-Za-z0-9_-]+$' }
        payer_account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$' }
        payee_account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$' }
        buyer_agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$' }
        seller_agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$' }
        amount: { $ref: '#/components/schemas/Amount' }
        authorization_id: { type: string, pattern: '^auth_[A-Za-z0-9_-]+$' }
        payment_mandate_id: { type: string, pattern: '^mdt_[A-Za-z0-9_-]+$' }
        delivery_id: { type: string, pattern: '^dlv_[A-Za-z0-9_-]+$' }
        delivery_evidence_hash: { type: string, pattern: '^sha256:[A-Za-z0-9]+$' }
        environment: { type: string, enum: [simulation, testnet, local, sandbox, live] }
        environment_contract_version: { type: string, enum: ['1.0'] }
        execution_backend: { type: string, enum: [simulated, x402] }
        chain_id: { type: [integer, 'null'], enum: [null, 84532, 8453] }
        network: { type: [string, 'null'], enum: [null, 'eip155:84532', 'eip155:8453'] }
        receipt_issuer_id: { type: string, pattern: '^bu2-reference-server:(local|sandbox|live)$' }
        payment_channel: { type: string, minLength: 1 }
        provider_reference: { type: [string, 'null'] }
        signed_at: { type: string, format: date-time }
        issued_at: { type: string, format: date-time }
        signature_algorithm: { type: string, enum: [Ed25519] }
        verification_key_id: { type: string }
        signature: { type: string }
        public_key: { type: string }
        valid: { type: boolean, readOnly: true }
        signature_valid: { type: boolean, readOnly: true }
        issuer_trusted: { type: boolean, readOnly: true }
        settlement_confirmed: { type: boolean, readOnly: true }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, request_id, trace_id]
          properties:
            type: { type: string }
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            trace_id: { type: string, pattern: '^trc_[A-Za-z0-9_-]{8,251}$' }
            details: { type: object, additionalProperties: true }
  responses:
    Unauthorized:
      description: Missing, invalid, expired, revoked, or reset bearer credential
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated principal lacks the permission or resource claim
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid body, path identifier, query, cursor, or idempotency key
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Idempotency or state conflict
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RequestTooLarge:
      description: JSON request body exceeds 1 MiB
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Content-Type is not application/json
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Provider returned an unverifiable or invalid payment result
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Inbound verification provider is unavailable or unsupported
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
