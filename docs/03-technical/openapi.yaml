openapi: 3.1.0
info:
  title: BU2 Agent Payment API
  version: 0.3.0
  description: Transaction-first API with environment-bound machine access, tenant-scoped agent operations, controlled operator surfaces, Receipt v0.2/v0.3 verification, reliable Webhooks, and explicit x402 settlement recovery.
  x-bu2-contract-status: phase0-frozen
servers:
  - url: https://api.bu2.com/v1
security:
  - bearerAuth: []
paths:
  /environment:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      security: []
      operationId: getEnvironment
      summary: Read the server-authored environment and execution contract before mutations
      responses:
        '200':
          description: Versioned environment information and current Receipt issuer
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /quotes:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: createQuote
      summary: Create a seller quote
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuote' }
      responses:
        '201':
          description: Quote created
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /payment_intents:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: createPaymentIntent
      summary: Create a buyer payment intent and evaluate its mandate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentIntent' }
      responses:
        '201':
          description: Intent created
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /payment_intents/{payment_intent_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: getPaymentIntent
      summary: Read payment and authorization state
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
      responses:
        '200':
          description: Current intent
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payment_intents/{payment_intent_id}/authorization:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: decideAuthorization
      summary: Record a human authorization decision
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [authorize, decline] }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Decision recorded
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /transactions:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: listTransactions
      summary: List transactions with payment, delivery, channel, and receipt context
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Transactions ordered newest first
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /transactions/{transaction_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: getTransaction
      summary: Read one transaction and its related payment evidence
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction detail
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /transactions/{transaction_id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: submitDelivery
      summary: Submit machine-readable delivery evidence
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryEvidence' }
      responses:
        '201':
          description: Delivery recorded
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [transaction, delivery]
                properties:
                  transaction: { $ref: '#/components/schemas/Transaction' }
                  delivery: { $ref: '#/components/schemas/DeliveryRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /transactions/{transaction_id}/settlements:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: settleTransaction
      summary: Settle a delivered transaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Settled and receipt issued
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                required: [transaction, receipt]
                properties:
                  transaction: { $ref: '#/components/schemas/Transaction' }
                  receipt: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /transactions/{transaction_id}/settlement_recoveries:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: recoverTransactionSettlement
      summary: Query an unknown provider settlement without submitting another payment
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Recovery query recorded; the result remains unknown or settlement and Receipt are finalized
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementRecoveryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /receipts/{receipt_id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: getReceipt
      summary: Read a verifiable receipt
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      responses:
        '200':
          description: Receipt
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /receipts/{receipt_id}/verify:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      security: []
      operationId: verifyReceipt
      summary: Verify a receipt signature and transaction binding
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      responses:
        '200':
          description: Receipt verification result
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [receipt_id, valid, signature_valid, issuer_trusted, settlement_confirmed, environment_valid, environment_interpretation, schema_version, canonicalization_version]
                properties:
                  receipt_id: { type: string, pattern: '^rcpt_[A-Za-z0-9_-]+$' }
                  valid: { type: boolean }
                  signature_valid: { type: boolean }
                  issuer_trusted: { type: boolean }
                  settlement_confirmed: { type: boolean }
                  environment_valid: { type: boolean }
                  environment_interpretation: { $ref: '#/components/schemas/ReceiptEnvironmentInterpretation' }
                  schema_version: { type: string, enum: ['0.1', '0.2', '0.3'] }
                  canonicalization_version: { type: string, enum: [BU2-LEGACY-0.1, RFC8785-JCS-1] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhook_subscriptions:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: createWebhookSubscription
      summary: Create an idempotent Webhook subscription
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWebhookSubscription' }
      responses:
        '201':
          description: Subscription metadata created; secret material is never returned
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /webhook_subscriptions/{subscription_id}/secret_rotations:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: rotateWebhookSecret
      summary: Add a new signing-secret version with a bounded overlap window
      parameters:
        - $ref: '#/components/parameters/WebhookSubscriptionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateWebhookSecret' }
      responses:
        '201':
          description: Rotation metadata created; secret material is never returned
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSecretRotation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /webhook_dead_letters:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: listWebhookDeadLetters
      summary: List terminal Webhook delivery failures
      responses:
        '200':
          description: Dead-lettered Outbox records
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookOutboxList' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /webhook_outbox/{outbox_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: listWebhookDeliveryAttempts
      summary: List immutable delivery-attempt audit records
      parameters:
        - $ref: '#/components/parameters/WebhookOutboxId'
      responses:
        '200':
          description: Delivery attempts ordered by occurrence
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryAttemptList' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /webhook_outbox/{outbox_id}/replays:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: replayWebhook
      summary: Requeue one dead-lettered event without creating a new business event
      parameters:
        - $ref: '#/components/parameters/WebhookOutboxId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayWebhook' }
      responses:
        '201':
          description: Replay audit record created and original event requeued
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookReplay' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /access:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      operationId: getAccessIdentity
      summary: Read the authenticated principal and its bounded permissions
      responses:
        '200':
          description: Current access identity without credential material
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /operations/support_bundles:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: createSupportBundle
      summary: Create a redacted operator diagnostic bundle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSupportBundle' }
      responses:
        '201':
          description: Redacted support bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportBundle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operations/tenants/{tenant_id}/resets:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    post:
      operationId: resetTenantAccess
      summary: Invalidate one Sandbox tenant credential generation without deleting financial facts
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantAccessResetRequest' }
      responses:
        '201':
          description: Tenant access reset audit result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantAccessReset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: Optional caller-supplied trace identifier; BU2 generates one when omitted.
      schema: { type: string, pattern: '^trc_[A-Za-z0-9_-]{8,251}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 255 }
    PaymentIntentId:
      name: payment_intent_id
      in: path
      required: true
      schema: { type: string, pattern: '^pi_[A-Za-z0-9_-]+$', maxLength: 255 }
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema: { type: string, pattern: '^txn_[A-Za-z0-9_-]+$', maxLength: 255 }
    ReceiptId:
      name: receipt_id
      in: path
      required: true
      schema: { type: string, pattern: '^rcpt_[A-Za-z0-9_-]+$', maxLength: 255 }
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, pattern: '^ten_[A-Za-z0-9_-]+$', maxLength: 255 }
    WebhookSubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema: { type: string, pattern: '^whsub_[A-Za-z0-9_-]+$', maxLength: 255 }
    WebhookOutboxId:
      name: outbox_id
      in: path
      required: true
      schema: { type: string, pattern: '^out_[A-Za-z0-9_-]+$', maxLength: 255 }
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the preceding page.
      schema: { type: string, minLength: 1, maxLength: 1024 }
  headers:
    RequestId:
      description: Server-generated identifier for this HTTP request.
      schema: { type: string, pattern: '^req_[A-Za-z0-9_-]+$' }
    TraceId:
      description: End-to-end trace identifier accepted from the caller or generated by BU2.
      schema: { type: string, pattern: '^trc_[A-Za-z0-9_-]{8,251}$' }
  schemas:
    EnvironmentInfo:
      type: object
      additionalProperties: false
      required: [service, environment, environment_contract_version, chain_id, network, execution_backend, api_contract_version, mcp_contract_versions, receipt_schema_versions, execution_status, access_contract_version, access_mode, public_capabilities, receipt_issuer]
      properties:
        service: { type: string, const: bu2-reference-server }
        environment: { type: string, enum: [local, sandbox, live] }
        environment_contract_version: { type: string, const: '1.0' }
        chain_id: { type: [integer, 'null'], enum: [null, 84532, 8453] }
        network: { type: [string, 'null'], enum: [null, 'eip155:84532', 'eip155:8453'] }
        execution_backend: { type: string, enum: [simulated, x402] }
        api_contract_version: { type: string, const: 0.3.0 }
        mcp_contract_versions:
          type: array
          minItems: 1
          items: { type: string, enum: [0.3.0] }
        receipt_schema_versions:
          type: array
          minItems: 2
          items: { type: string, enum: ['0.2', '0.3'] }
        execution_status: { type: string, enum: [execution_disabled, execution_enabled] }
        access_contract_version: { type: string, const: '1.0' }
        access_mode: { type: string, enum: [development_open, authenticated] }
        public_capabilities:
          type: array
          items: { type: string }
        receipt_issuer: { $ref: '#/components/schemas/ReceiptIssuer' }
    AccessIdentity:
      type: object
      additionalProperties: false
      required: [mode, authenticated, environment, principal_id, tenant_id, role, permissions, account_ids, agent_ids, credential_generation]
      properties:
        mode: { type: string, enum: [development_open, authenticated] }
        authenticated: { type: boolean }
        environment: { type: string, enum: [local, sandbox, live] }
        principal_id: { type: [string, 'null'] }
        tenant_id: { type: [string, 'null'] }
        role: { type: [string, 'null'], enum: [agent, developer, operator, null] }
        permissions: { type: array, items: { type: string } }
        account_ids: { type: array, items: { type: string } }
        agent_ids: { type: array, items: { type: string } }
        credential_generation: { type: [integer, 'null'] }
    CreateSupportBundle:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        transaction_id: { type: string, pattern: '^txn_[A-Za-z0-9_-]+$', maxLength: 255 }
        request_id: { type: string, pattern: '^req_[A-Za-z0-9_-]+$', maxLength: 255 }
        trace_id: { type: string, pattern: '^trc_[A-Za-z0-9_-]{8,251}$', maxLength: 255 }
    SupportBundle:
      type: object
      additionalProperties: true
      required: [id, schema_version, generated_at, requested_by, reason, environment, service, correlation, diagnostics, transaction, redaction]
      properties:
        id: { type: string, pattern: '^sup_[A-Za-z0-9_-]+$' }
        schema_version: { type: string, const: '1.0' }
        generated_at: { type: string, format: date-time }
        requested_by: { type: string }
        reason: { type: string }
        environment: { type: object, additionalProperties: true }
        service: { type: object, additionalProperties: true }
        correlation: { type: object, additionalProperties: true }
        diagnostics: { type: object, additionalProperties: true }
        transaction: { type: [object, 'null'], additionalProperties: true }
        redaction: { type: object, additionalProperties: true }
    TenantAccessResetRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    TenantAccessReset:
      type: object
      additionalProperties: false
      required: [id, environment, target_tenant_id, previous_generation, new_generation, requested_by, reason, request_id, trace_id, created_at]
      properties:
        id: { type: string, pattern: '^tar_[A-Za-z0-9_-]+$' }
        environment: { type: string, enum: [sandbox] }
        target_tenant_id: { type: string, pattern: '^ten_[A-Za-z0-9_-]+$' }
        previous_generation: { type: integer, minimum: 0 }
        new_generation: { type: integer, minimum: 2 }
        requested_by: { type: string }
        reason: { type: string }
        request_id: { type: string, pattern: '^req_[A-Za-z0-9_-]+$' }
        trace_id: { type: string, pattern: '^trc_[A-Za-z0-9_-]{8,251}$' }
        created_at: { type: string, format: date-time }
    ReceiptIssuer:
      type: object
      additionalProperties: false
      required: [issuer_id, environment, verification_key_id, signature_algorithm, public_key]
      properties:
        issuer_id: { type: string, pattern: '^bu2-reference-server:(local|sandbox|live)$' }
        environment: { type: string, enum: [local, sandbox, live] }
        verification_key_id: { type: string }
        signature_algorithm: { type: string, enum: [Ed25519] }
        public_key: { type: string }
    ReceiptEnvironmentInterpretation:
      type: object
      additionalProperties: false
      required: [source, original, derived, evidence]
      properties:
        source: { type: string, enum: [native, legacy, unknown] }
        original: { type: [string, 'null'] }
        derived: { type: [string, 'null'], enum: [local, sandbox, live, null] }
        evidence: { type: string }
    CreateWebhookSubscription:
      type: object
      additionalProperties: false
      required: [id, url, secret]
      properties:
        id: { type: string, pattern: '^whsub_[A-Za-z0-9_-]+$', maxLength: 255 }
        url: { type: string, format: uri, pattern: '^https?://', maxLength: 2048 }
        secret: { type: string, minLength: 16, maxLength: 512, writeOnly: true }
    WebhookSecretVersion:
      type: object
      additionalProperties: false
      required: [version, valid_from, valid_until, created_at, current]
      properties:
        version: { type: string, pattern: '^v[1-9][0-9]*$', maxLength: 32 }
        valid_from: { type: integer, minimum: 0 }
        valid_until: { type: [integer, 'null'], minimum: 0 }
        created_at: { type: string, format: date-time }
        current: { type: boolean }
    WebhookSubscription:
      type: object
      additionalProperties: false
      required: [id, url, active, current_secret_version, created_at, secret_versions]
      properties:
        id: { type: string, pattern: '^whsub_[A-Za-z0-9_-]+$' }
        url: { type: string, format: uri }
        active: { type: boolean }
        current_secret_version: { type: string, pattern: '^v[1-9][0-9]*$' }
        created_at: { type: string, format: date-time }
        secret_versions:
          type: array
          items: { $ref: '#/components/schemas/WebhookSecretVersion' }
    RotateWebhookSecret:
      type: object
      additionalProperties: false
      required: [version, secret, overlap_seconds]
      properties:
        version: { type: string, pattern: '^v[1-9][0-9]*$', maxLength: 32 }
        secret: { type: string, minLength: 16, maxLength: 512, writeOnly: true }
        overlap_seconds: { type: integer, minimum: 0, maximum: 86400 }
    WebhookSecretRotation:
      type: object
      additionalProperties: false
      required: [id, subscription_id, previous_version, new_version, overlap_until, created_at]
      properties:
        id: { type: string, pattern: '^whr_[A-Za-z0-9_-]+$' }
        subscription_id: { type: string, pattern: '^whsub_[A-Za-z0-9_-]+$' }
        previous_version: { type: string, pattern: '^v[1-9][0-9]*$' }
        new_version: { type: string, pattern: '^v[1-9][0-9]*$' }
        overlap_until: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    WebhookOutboxRecord:
      type: object
      required: [id, event_id, subscription_id, payload, status, attempts, next_attempt_at, replay_count]
      properties:
        id: { type: string, pattern: '^out_[A-Za-z0-9_-]+$' }
        event_id: { type: string, pattern: '^evt_[A-Za-z0-9_-]+$' }
        subscription_id: { type: string, pattern: '^whsub_[A-Za-z0-9_-]+$' }
        payload: { type: string, description: Serialized immutable LedgerEvent }
        status: { type: string, enum: [pending, delivering, retrying, dead_letter, delivered] }
        attempts: { type: integer, minimum: 0 }
        next_attempt_at: { type: integer, minimum: 0 }
        last_error: { type: [string, 'null'] }
        delivered_at: { type: [string, 'null'], format: date-time }
        dead_lettered_at: { type: [string, 'null'], format: date-time }
        lease_expires_at: { type: [integer, 'null'], minimum: 0 }
        locked_by: { type: [string, 'null'] }
        last_attempt_at: { type: [string, 'null'], format: date-time }
        replay_count: { type: integer, minimum: 0 }
        last_replayed_at: { type: [string, 'null'], format: date-time }
        request_id: { type: [string, 'null'], pattern: '^req_[A-Za-z0-9_-]+$' }
        trace_id: { type: [string, 'null'], pattern: '^trc_[A-Za-z0-9_-]{8,251}$' }
        transaction_id: { type: [string, 'null'], pattern: '^txn_[A-Za-z0-9_-]+$' }
    WebhookOutboxList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/WebhookOutboxRecord' } }
    WebhookDeliveryAttempt:
      type: object
      additionalProperties: false
      required: [id, outbox_id, event_id, subscription_id, replay_cycle, attempt_number, worker_id, status, secret_versions, started_at, completed_at]
      properties:
        id: { type: string, pattern: '^wha_[A-Za-z0-9_-]+$' }
        outbox_id: { type: string, pattern: '^out_[A-Za-z0-9_-]+$' }
        event_id: { type: string, pattern: '^evt_[A-Za-z0-9_-]+$' }
        subscription_id: { type: string, pattern: '^whsub_[A-Za-z0-9_-]+$' }
        replay_cycle: { type: integer, minimum: 0 }
        attempt_number: { type: integer, minimum: 1 }
        worker_id: { type: string, pattern: '^whw_[A-Za-z0-9_-]+$' }
        status: { type: string, enum: [retrying, dead_letter, delivered] }
        http_status: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        error: { type: [string, 'null'], maxLength: 500 }
        secret_versions:
          type: array
          items: { type: string, pattern: '^v[1-9][0-9]*$' }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        request_id: { type: [string, 'null'], pattern: '^req_[A-Za-z0-9_-]+$' }
        trace_id: { type: [string, 'null'], pattern: '^trc_[A-Za-z0-9_-]{8,251}$' }
        transaction_id: { type: [string, 'null'], pattern: '^txn_[A-Za-z0-9_-]+$' }
    WebhookDeliveryAttemptList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/WebhookDeliveryAttempt' } }
    ReplayWebhook:
      type: object
      additionalProperties: false
      required: [requested_by, reason]
      properties:
        requested_by: { type: string, minLength: 1, maxLength: 255 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    WebhookReplay:
      type: object
      additionalProperties: false
      required: [id, outbox_id, event_id, subscription_id, requested_by, reason, prior_status, created_at]
      properties:
        id: { type: string, pattern: '^whrp_[A-Za-z0-9_-]+$' }
        outbox_id: { type: string, pattern: '^out_[A-Za-z0-9_-]+$' }
        event_id: { type: string, pattern: '^evt_[A-Za-z0-9_-]+$' }
        subscription_id: { type: string, pattern: '^whsub_[A-Za-z0-9_-]+$' }
        requested_by: { type: string, minLength: 1, maxLength: 255 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        prior_status: { type: string, enum: [dead_letter] }
        created_at: { type: string, format: date-time }
    Amount:
      type: object
      additionalProperties: false
      required: [value, currency]
      properties:
        value: { type: integer, minimum: 0, description: Amount in minor units }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    CreateQuote:
      type: object
      additionalProperties: false
      required: [seller_agent_id, payee_account_id, item, amount, expires_at]
      properties:
        seller_agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$', maxLength: 255 }
        payee_account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$', maxLength: 255 }
        item:
          type: object
          additionalProperties: false
          required: [name, delivery_type]
          properties:
            name: { type: string, minLength: 1, maxLength: 200 }
            delivery_type: { type: string, minLength: 1, maxLength: 100 }
        amount: { $ref: '#/components/schemas/Amount' }
        expires_at: { type: string, format: date-time }
    Quote:
      type: object
      additionalProperties: false
      required: [id, seller_agent_id, payee_account_id, item, amount, expires_at, status, created_at]
      properties:
        id: { type: string, pattern: '^quo_[A-Za-z0-9_-]+$' }
        seller_agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$', maxLength: 255 }
        payee_account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$', maxLength: 255 }
        item:
          type: object
          additionalProperties: false
          required: [name, delivery_type]
          properties:
            name: { type: string, minLength: 1, maxLength: 200 }
            delivery_type: { type: string, minLength: 1, maxLength: 100 }
        amount: { $ref: '#/components/schemas/Amount' }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [active, accepted, expired, canceled] }
        created_at: { type: string, format: date-time }
    ExternalContext:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, enum: [chatgpt_conversation, codex_task, agent_run, automation, other] }
        id: { type: string, minLength: 1, maxLength: 255 }
    CreatePaymentIntent:
      type: object
      additionalProperties: false
      required: [quote_id, payer_account_id, buyer_agent_id, payment_mandate_id, amount, purpose]
      properties:
        quote_id: { type: string, pattern: '^quo_[A-Za-z0-9_-]+$', maxLength: 255 }
        payer_account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$', maxLength: 255 }
        buyer_agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$', maxLength: 255 }
        payment_mandate_id: { type: string, pattern: '^mdt_[A-Za-z0-9_-]+$', maxLength: 255 }
        amount: { $ref: '#/components/schemas/Amount' }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        external_context: { $ref: '#/components/schemas/ExternalContext' }
        metadata:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }
    Authorization:
      type: object
      additionalProperties: false
      required: [id, decision, reason_code, matched_rules]
      properties:
        id: { type: string, pattern: '^auth_[A-Za-z0-9_-]+$' }
        decision: { type: string, enum: [allowed, review_required, denied] }
        reason_code: { type: string }
        matched_rules: { type: array, items: { type: string } }
    PaymentIntent:
      type: object
      additionalProperties: false
      required: [id, quote_id, payer_account_id, payee_account_id, buyer_agent_id, seller_agent_id, payment_mandate_id, amount, purpose, status, transaction_id, authorization, created_at]
      properties:
        id: { type: string, pattern: '^pi_[A-Za-z0-9_-]+$' }
        quote_id: { type: string, pattern: '^quo_[A-Za-z0-9_-]+$', maxLength: 255 }
        payer_account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$', maxLength: 255 }
        payee_account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$', maxLength: 255 }
        buyer_agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$', maxLength: 255 }
        seller_agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$', maxLength: 255 }
        payment_mandate_id: { type: string, pattern: '^mdt_[A-Za-z0-9_-]+$', maxLength: 255 }
        amount: { $ref: '#/components/schemas/Amount' }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        external_context: { $ref: '#/components/schemas/ExternalContext' }
        metadata:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }
        status: { type: string, enum: [requires_authorization, authorized, funds_reserved, delivery_submitted, settled, declined, expired, canceled, refunded, disputed] }
        transaction_id: { type: [string, 'null'], pattern: '^txn_[A-Za-z0-9_-]+$' }
        authorization: { $ref: '#/components/schemas/Authorization' }
        created_at: { type: string, format: date-time }
    DeliveryEvidence:
      type: object
      additionalProperties: false
      required: [type, evidence_hash]
      properties:
        type: { type: string, minLength: 1, maxLength: 100 }
        evidence_hash: { type: string, pattern: '^sha256:[A-Za-z0-9]+$', maxLength: 256 }
        summary: { type: string, maxLength: 1000 }
    DeliveryRecord:
      type: object
      additionalProperties: false
      required: [id, transaction_id, type, evidence_hash, submitted_at]
      properties:
        id: { type: string, pattern: '^dlv_[A-Za-z0-9_-]+$' }
        transaction_id: { type: string, pattern: '^txn_[A-Za-z0-9_-]+$' }
        type: { type: string, minLength: 1, maxLength: 100 }
        evidence_hash: { type: string, pattern: '^sha256:[A-Za-z0-9]+$', maxLength: 256 }
        summary: { type: string, maxLength: 1000 }
        submitted_at: { type: string, format: date-time }
    Transaction:
      type: object
      required: [id, payment_intent_id, status, authorized_amount, reserved_amount, settled_amount, refunded_amount]
      properties:
        id: { type: string, pattern: '^txn_[A-Za-z0-9_-]+$' }
        payment_intent_id: { type: string, pattern: '^pi_[A-Za-z0-9_-]+$' }
        status: { type: string, enum: [authorized, funds_reserved, delivery_submitted, settled, canceled, refunded, disputed] }
        authorized_amount: { $ref: '#/components/schemas/Amount' }
        reserved_amount: { $ref: '#/components/schemas/Amount' }
        settled_amount: { $ref: '#/components/schemas/Amount' }
        refunded_amount: { $ref: '#/components/schemas/Amount' }
    TransactionView:
      type: object
      required: [transaction, payment_intent, quote, delivery, receipt, payment_channel, settlement_control]
      properties:
        transaction: { $ref: '#/components/schemas/Transaction' }
        payment_intent:
          anyOf:
            - { $ref: '#/components/schemas/PaymentIntent' }
            - { type: 'null' }
        quote:
          anyOf:
            - { $ref: '#/components/schemas/Quote' }
            - { type: 'null' }
        delivery:
          anyOf:
            - { $ref: '#/components/schemas/DeliveryRecord' }
            - { type: 'null' }
        receipt:
          anyOf:
            - { $ref: '#/components/schemas/Receipt' }
            - { type: 'null' }
        payment_channel: { type: string }
        settlement_control:
          anyOf:
            - { $ref: '#/components/schemas/SettlementControl' }
            - { type: 'null' }
    SettlementControl:
      type: object
      additionalProperties: false
      required: [status, provider_reference, reason_code, updated_at, resolved_at, recovery_attempts]
      properties:
        status: { type: string, enum: [settled, provider_unknown] }
        provider_reference: { type: string }
        reason_code: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        recovery_attempts: { type: integer, minimum: 0 }
    SettlementRecovery:
      type: object
      additionalProperties: false
      required: [status, reason_code, attempt_id]
      properties:
        status: { type: string, enum: [provider_unknown, settled] }
        reason_code: { type: [string, 'null'] }
        attempt_id: { type: string, pattern: '^arv_[A-Za-z0-9_-]+$' }
    SettlementRecoveryResult:
      type: object
      additionalProperties: false
      required: [transaction, receipt, recovery]
      properties:
        transaction: { $ref: '#/components/schemas/Transaction' }
        receipt:
          anyOf:
            - { $ref: '#/components/schemas/Receipt' }
            - { type: 'null' }
        recovery: { $ref: '#/components/schemas/SettlementRecovery' }
    PageMetadata:
      type: object
      additionalProperties: false
      required: [limit, has_more, next_cursor]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }
    TransactionPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TransactionView' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    Receipt:
      type: object
      additionalProperties: false
      required: [id, version, schema_version, canonicalization_version, transaction_id, settlement_id, quote_id, payment_intent_id, payer_account_id, payee_account_id, buyer_agent_id, seller_agent_id, amount, authorization_id, payment_mandate_id, delivery_id, delivery_evidence_hash, environment, payment_channel, provider_reference, signed_at, issued_at, signature_algorithm, verification_key_id, signature, public_key]
      allOf:
        - if:
            properties:
              schema_version: { const: '0.3' }
            required: [schema_version]
          then:
            required: [environment_contract_version, execution_backend, chain_id, network, receipt_issuer_id]
      properties:
        id: { type: string, pattern: '^rcpt_[A-Za-z0-9_-]+$' }
        version: { type: string, enum: ['0.2', '0.3'] }
        schema_version: { type: string, enum: ['0.2', '0.3'] }
        canonicalization_version: { type: string, enum: [RFC8785-JCS-1] }
        transaction_id: { type: string, pattern: '^txn_[A-Za-z0-9_-]+$' }
        settlement_id: { type: string, pattern: '^stl_[A-Za-z0-9_-]+$' }
        quote_id: { type: string, pattern: '^quo_[A-Za-z0-9_-]+$' }
        payment_intent_id: { type: string, pattern: '^pi_[A-Za-z0-9_-]+$' }
        payer_account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$' }
        payee_account_id: { type: string, pattern: '^acct_[A-Za-z0-9_-]+$' }
        buyer_agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$' }
        seller_agent_id: { type: string, pattern: '^agt_[A-Za-z0-9_-]+$' }
        amount: { $ref: '#/components/schemas/Amount' }
        authorization_id: { type: string, pattern: '^auth_[A-Za-z0-9_-]+$' }
        payment_mandate_id: { type: string, pattern: '^mdt_[A-Za-z0-9_-]+$' }
        delivery_id: { type: string, pattern: '^dlv_[A-Za-z0-9_-]+$' }
        delivery_evidence_hash: { type: string, pattern: '^sha256:[A-Za-z0-9]+$' }
        environment: { type: string, enum: [simulation, testnet, local, sandbox, live] }
        environment_contract_version: { type: string, enum: ['1.0'] }
        execution_backend: { type: string, enum: [simulated, x402] }
        chain_id: { type: [integer, 'null'], enum: [null, 84532, 8453] }
        network: { type: [string, 'null'], enum: [null, 'eip155:84532', 'eip155:8453'] }
        receipt_issuer_id: { type: string, pattern: '^bu2-reference-server:(local|sandbox|live)$' }
        payment_channel: { type: string, minLength: 1 }
        provider_reference: { type: [string, 'null'] }
        signed_at: { type: string, format: date-time }
        issued_at: { type: string, format: date-time }
        signature_algorithm: { type: string, enum: [Ed25519] }
        verification_key_id: { type: string }
        signature: { type: string }
        public_key: { type: string }
        valid: { type: boolean, readOnly: true }
        signature_valid: { type: boolean, readOnly: true }
        issuer_trusted: { type: boolean, readOnly: true }
        settlement_confirmed: { type: boolean, readOnly: true }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, request_id, trace_id]
          properties:
            type: { type: string }
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            trace_id: { type: string, pattern: '^trc_[A-Za-z0-9_-]{8,251}$' }
            details: { type: object, additionalProperties: true }
  responses:
    Unauthorized:
      description: Missing, invalid, expired, revoked, or reset bearer credential
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated principal lacks the permission or resource claim
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid body, path identifier, query, cursor, or idempotency key
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Idempotency or state conflict
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RequestTooLarge:
      description: JSON request body exceeds 1 MiB
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Content-Type is not application/json
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
