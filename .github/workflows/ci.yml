name: BU2 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bu2-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: |
          npm --prefix sandbox ci
          npm --prefix packages/typescript-sdk ci
          npm --prefix prototype ci
      - name: Run foundation gate
        env:
          BU2_SOURCE_COMMIT: ${{ github.sha }}
        run: node deploy/la06a-local-gate.mjs > foundation.json 2> foundation.stderr
      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bu2-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            foundation.json
            foundation.stderr
          if-no-files-found: error

  runtime:
    name: runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install sandbox dependencies
        run: npm --prefix sandbox ci
      - name: Test CI and runtime evidence contracts
        run: node --test scripts/ci/*.test.mjs deploy/runtime-assurance.test.mjs deploy/runtime-image-assurance.test.mjs
      - name: Run runtime assurance
        env:
          BU2_SOURCE_COMMIT: ${{ github.sha }}
        run: node deploy/runtime-assurance.mjs > runtime-assurance.json 2> runtime-assurance.stderr
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bu2-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-assurance.json
            runtime-assurance.stderr
          if-no-files-found: error

  runtime-image:
    name: runtime image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build immutable runtime image
        run: docker build --file deploy/Dockerfile --iidfile runtime-image-id --tag bu2-ci-rt01:${{ github.run_id }} .
      - name: Verify runtime inside image
        run: |
          image_id="$(cat runtime-image-id)"
          docker run --rm --network none --read-only --user 10001:10001 \
            --tmpfs /tmp:rw,size=16m,uid=10001,gid=10001,mode=1770 \
            --env BU2_IMAGE_ID="$image_id" \
            --env BU2_SOURCE_COMMIT="$GITHUB_SHA" \
            --entrypoint node "$image_id" sandbox/runtime-image-assurance.mjs \
            > runtime-image-assurance.json 2> runtime-image-assurance.stderr
          node deploy/validate-runtime-image.mjs runtime-image-assurance.json runtime-image-id
      - name: Upload runtime image evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bu2-runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-image-id
            runtime-image-assurance.json
            runtime-image-assurance.stderr
          if-no-files-found: error

  gate:
    name: BU2 / CI Gate
    if: always()
    needs: [foundation, runtime, runtime-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download foundation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bu2-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/foundation
          merge-multiple: true
      - name: Download runtime evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bu2-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/runtime
          merge-multiple: true
      - name: Download runtime image evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bu2-runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/runtime-image
          merge-multiple: true
      - name: Validate runtime image evidence
        run: node deploy/validate-runtime-image.mjs evidence/runtime-image/runtime-image-assurance.json evidence/runtime-image/runtime-image-id
      - name: Validate evidence and source binding
        run: node scripts/ci/validate-evidence.mjs evidence/foundation/foundation.json evidence/runtime/runtime-assurance.json evidence/foundation/foundation.stderr evidence/runtime/runtime-assurance.stderr ci-evidence.json
      - name: Upload validated manifest
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bu2-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence.json
          if-no-files-found: error
      - name: Require foundation, runtime and evidence success
        run: |
          test "${{ needs.foundation.result }}" = success
          test "${{ needs.runtime.result }}" = success
          test "${{ needs['runtime-image'].result }}" = success
